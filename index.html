<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bot Club</title>
    <meta name="description" content="A tiny top-down nightclub. Write the door policy and Cloudflare Clef-flash decides who gets in, one bot at a time." />
    <meta name="theme-color" content="#0d0c12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bot Club" />
    <meta property="og:description" content="Write the door policy. Clef-flash decides who gets in." />
    <link rel="canonical" href="https://bot-club.jadu.workers.dev/" />
    <meta property="og:url" content="https://bot-club.jadu.workers.dev/" />
    <meta property="og:image" content="https://bot-club.jadu.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bot Club: bright dots with eyes queueing at a club door." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bot Club" />
    <meta name="twitter:description" content="Write the door policy. Clef-flash decides who gets in." />
    <meta name="twitter:image" content="https://bot-club.jadu.workers.dev/og.png" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Club floor. Arrow keys pick a bot."></canvas>

    <header class="top" id="top">
      <h1 class="title" aria-label="Bot Club">
        <span aria-hidden="true">B</span><span class="o" aria-hidden="true"><i></i><i></i></span><span aria-hidden="true">T CLUB</span>
      </h1>

      <form class="rule" id="rule-form" autocomplete="off" novalidate>
        <textarea
          id="rule"
          name="rule"
          rows="1"
          role="combobox"
          aria-label="Door rule"
          aria-autocomplete="none"
          aria-expanded="false"
          aria-controls="rules"
          maxlength="140"
          spellcheck="true"
          enterkeyhint="done"
        ></textarea>
        <button type="submit" id="rule-save" class="rule-save" aria-label="Use this rule" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
        </button>
        <button type="button" id="rules-toggle" class="rule-more" tabindex="-1" aria-label="Ready-made rules" aria-expanded="false" aria-controls="rules">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9.5 6 6 6-6" /></svg>
        </button>
        <ul id="rules" class="rules" role="listbox" aria-label="Ready-made rules" hidden></ul>
      </form>

      <div class="board">
        <button type="button" class="score" id="score" aria-haspopup="dialog">
          <span class="tally in"><i aria-hidden="true"></i><b id="n-in">0</b><small>/150</small></span>
          <span class="tally out"><i aria-hidden="true"></i><b id="n-out">0</b></span>
        </button>
        <p class="speed" id="speed" title="Median answer time">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6.5L10 22l9-11.5h-6.5z" /></svg>
          <span class="quiet">Median answer time</span>
          <b id="n-ms">–</b><small>ms</small>
        </p>
      </div>
    </header>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <section id="card" class="card" aria-labelledby="card-name" hidden>
      <div class="card-head">
        <span class="swatch" id="card-swatch"></span>
        <h2 class="card-name" id="card-name"></h2>
        <span class="pill" id="card-status"></span>
        <button type="button" class="card-close" id="card-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
        </button>
      </div>
      <div class="card-body" id="card-body"></div>
    </section>

    <footer class="dock" id="dock">
      <div class="send" role="group" aria-label="Send bots">
        <span class="send-face" aria-hidden="true"><i></i><i></i></span>
        <button type="button" data-count="5" aria-label="Send 5 bots">+5</button>
        <button type="button" data-count="25" aria-label="Send 25 bots">+25</button>
        <button type="button" data-count="100" aria-label="Send 100 bots">+100</button>
      </div>
      <p class="send-state" id="send-state" hidden></p>
      <div class="tools">
        <button type="button" id="retry" class="btn warn" hidden>Retry</button>
        <button type="button" id="restart" class="btn" hidden>Start over</button>
      </div>
      <p class="credit">
        <a href="https://developers.cloudflare.com/workers-ai/models/clef-flash/" target="_blank" rel="noopener">Clef-flash</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/jackdnl/bot-club" target="_blank" rel="noopener">GitHub</a>
      </p>
    </footer>

    <dialog id="guests" class="guests" aria-labelledby="guests-title">
      <div class="guests-head">
        <h2 id="guests-title">Guests</h2>
        <button type="button" class="card-close" id="guests-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
        </button>
      </div>
      <p class="guests-empty" id="guests-empty">Nobody yet.</p>
      <ol class="guest-list" id="guest-list"></ol>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
