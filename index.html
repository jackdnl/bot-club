<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bot Club</title>
    <meta name="description" content="A tiny top-down nightclub. Write the door policy and Cloudflare Clef-flash decides who gets in, one bot at a time." />
    <meta name="theme-color" content="#0d0c12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bot Club" />
    <meta property="og:description" content="Write the door policy. Clef-flash decides who gets in." />
    <link rel="canonical" href="https://bot-club.jadu.workers.dev/" />
    <meta property="og:url" content="https://bot-club.jadu.workers.dev/" />
    <meta property="og:image" content="https://bot-club.jadu.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bot Club: bright dots with eyes queueing at a club door." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bot Club" />
    <meta name="twitter:description" content="Write the door policy. Clef-flash decides who gets in." />
    <meta name="twitter:image" content="https://bot-club.jadu.workers.dev/og.png" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Club floor plan. Arrow keys step through bots, Escape closes the card."></canvas>

    <header class="top" id="top">
      <h1 class="title" aria-label="Bot Club">
        <span aria-hidden="true">B</span><span class="o" aria-hidden="true"><i></i><i></i></span><span aria-hidden="true">T CLUB</span>
      </h1>

      <form class="policy" id="policy-form" autocomplete="off" novalidate>
        <label class="quiet" for="policy">Door policy</label>
        <div class="policy-field">
          <input id="policy" name="policy" maxlength="140" spellcheck="true" enterkeyhint="done" placeholder="Write your own rule…" />
          <button type="button" id="custom-rule" class="ghost" aria-controls="policy">Custom rule</button>
          <button type="submit" id="apply" class="apply" disabled>Apply</button>
          <div class="presets-wrap">
            <button type="button" id="presets-toggle" class="ghost" aria-haspopup="menu" aria-expanded="false" aria-controls="presets">Presets</button>
            <div id="presets" class="presets" role="menu" aria-label="Preset door policies" hidden></div>
          </div>
        </div>
      </form>

      <dl class="metrics" aria-label="Live metrics">
        <div><dt>decisions/s</dt><dd id="m-rate">–</dd></div>
        <div><dt>median trip</dt><dd id="m-median">–</dd></div>
        <div><dt>waiting</dt><dd id="m-waiting">0</dd></div>
        <div><dt>admitted</dt><dd><span id="m-inside">0</span><small id="m-cap">/150</small></dd></div>
        <div class="m-extra"><dt>turned away</dt><dd id="m-out">0</dd></div>
      </dl>
    </header>

    <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <section id="card" class="card" aria-label="Guest" hidden>
      <div class="card-head">
        <span class="swatch" id="card-swatch"></span>
        <h2 class="card-name" id="card-name"></h2>
        <span class="pill" id="card-status"></span>
        <button type="button" class="card-close" id="card-close" aria-label="Close guest card">×</button>
      </div>
      <p class="card-meta" id="card-meta"></p>
      <p class="card-item" id="card-item"></p>
      <p class="card-intro" id="card-intro"></p>
      <dl class="card-facts" id="card-facts"></dl>
      <button type="button" class="card-retry" id="card-retry" hidden>Retry</button>
    </section>

    <footer class="dock" id="dock">
      <div class="spawn">
        <div class="sizes" role="radiogroup" aria-label="Batch size">
          <button type="button" role="radio" aria-checked="false" data-size="5">5</button>
          <button type="button" role="radio" aria-checked="true" data-size="25">25</button>
          <button type="button" role="radio" aria-checked="false" data-size="100">100</button>
        </div>
        <button type="button" id="spawn" class="primary" aria-describedby="spawn-hint">
          <span id="spawn-label">+25 bots</span>
        </button>
        <span id="spawn-hint" class="quiet">Hold to keep them coming</span>
      </div>
      <div class="tools">
        <button type="button" id="retry-all" class="ghost warn" hidden>Retry</button>
        <button type="button" id="guests-toggle" class="ghost" aria-haspopup="dialog">Guests</button>
        <button type="button" id="reset" class="ghost">Reset</button>
      </div>
      <p class="credit">
        <a href="https://developers.cloudflare.com/workers-ai/models/clef-flash/" target="_blank" rel="noopener">Clef-flash</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/jackdnl/bot-club" target="_blank" rel="noopener">GitHub</a>
      </p>
    </footer>

    <dialog id="guests" class="guests" aria-labelledby="guests-title">
      <div class="guests-head">
        <h2 id="guests-title">Guests</h2>
        <button type="button" class="ghost" id="guests-close">Close</button>
      </div>
      <p class="guests-empty" id="guests-empty">Nobody yet.</p>
      <ol class="guest-list" id="guest-list"></ol>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
